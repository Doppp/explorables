<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A local Explorables course" />
    <title>Explorables courses</title>
    <script>
      (() => {
        const storedTheme = localStorage.getItem("explorables:theme");
        const theme =
          storedTheme === "light" || storedTheme === "dark"
            ? storedTheme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <nav aria-label="Skip links">
      <a class="skip-link" href="#root">Skip to content</a>
    </nav>
    <div id="root" tabindex="-1"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
